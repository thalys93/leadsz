name: leadsz

services:
  leadsz_db:
    image: postgres:16
    container_name: leadsz_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-leadsz}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - leadsz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: leadsz_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: leadsz_db
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "${PORT:-3003}:${PORT:-3003}"
    depends_on:
      leadsz_db:
        condition: service_healthy

volumes:
  leadsz_pgdata:
